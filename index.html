  --good:#55c99a; --good-soft:#173528; --wait:#f0bf5f; --wait-soft:#3a2f17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111915; --surface:#18221d; --surface-2:#1e2a24; --ink:#f1ebe1; --ink-2:#b8c2ba; --ink-3:#919d94;
  --line:#2b3831; --line-2:#3a4a41;
  --forest:#1f3029; --forest-2:#182620; --on-forest:#f1ebe1; --on-forest-2:#b5c3b6;
  --sage:#9fb68a; --sage-ink:#132019; --sage-dim:#6f8a63;
  --t-pan:#55c99a; --t-orc:#f0bf5f; --t-pes:#f0955a; --t-con:#93afef;
  --good:#55c99a; --good-soft:#173528; --wait:#f0bf5f; --wait-soft:#3a2f17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;line-height:1.12;text-wrap:balance;font-weight:800;letter-spacing:-.015em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.num,.mono{font-variant-numeric:tabular-nums}
.uk{display:inline-block;width:20px;height:10px;flex:none;background:var(--flag) center/cover no-repeat;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--accent,var(--ink-2))}
.lede{color:var(--ink-2);max-width:62ch}

/* Capa em vídeo: os quatro cartões gravados no vídeo viram as abas (áreas clicáveis por cima) */
.hero{position:relative;background:#16224f}
.cover{position:relative;max-width:1280px;margin:0 auto;aspect-ratio:16/9;overflow:hidden;container-type:inline-size;background:#16224f center/cover no-repeat;background-image:var(--poster)}
.cover video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease}
.cover video.on{opacity:1}
.hot{position:absolute;top:67.4%;height:22.6%;width:19.1%;border-radius:1.2cqw;text-decoration:none;outline:none;transition:box-shadow .35s var(--ease),background-color .35s var(--ease),transform .35s var(--ease)}
.hot .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.hot-pan{left:5.7%} .hot-orc{left:28.5%} .hot-con{left:51.4%} .hot-pes{left:75.2%}
.hot:hover{box-shadow:0 0 0 2px rgba(253,246,239,.75);background-color:rgba(255,255,255,.07)}
.hot:active{transform:scale(.97)}
.hot:focus-visible{box-shadow:0 0 0 3px #fdf6ef,0 0 0 7px rgba(253,246,239,.35)}
.hot[aria-current="true"]{box-shadow:0 0 0 3px #fdf6ef,0 14px 34px rgba(0,0,0,.45)}
.hot::after{content:"";position:absolute;left:50%;bottom:-14px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fdf6ef;transform:scale(0);transition:transform .4s var(--ease)}
.hot[aria-current="true"]::after{transform:scale(1)}
.cover.picked .hot:not([aria-current="true"]){background-color:rgba(10,14,30,.28)}
.cover.picked .hot:not([aria-current="true"]):hover{background-color:rgba(255,255,255,.07)}
.pp{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(29% + 6px);border:0;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;background:rgba(10,14,30,.45);color:#fdf6ef;cursor:pointer;opacity:.75;transition:opacity .2s}
.pp:hover,.pp:focus-visible{opacity:1;outline:2px solid #fdf6ef;outline-offset:2px}
.pp svg{width:14px;height:14px;fill:currentColor}
.tabs{display:none}
.tab{display:flex;flex-direction:column;justify-content:center;gap:0;min-height:58px;padding:8px 12px;border-radius:12px;text-decoration:none;color:#fff;background:var(--tc);opacity:.78;transition:transform .3s var(--ease),opacity .3s var(--ease),box-shadow .3s var(--ease);outline:none}
.tab .t1{font-weight:300;font-size:.86rem;line-height:1.15}
.tab .t2{font-weight:800;font-size:.95rem;line-height:1.15}
.tab:active{transform:scale(.97)}
.tab:focus-visible{box-shadow:0 0 0 3px var(--ink)}
.tab[aria-selected="true"]{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--tc)}
.tab-pan{--tc:var(--c-pan)} .tab-orc{--tc:var(--c-orc);color:var(--on-orc)} .tab-pes{--tc:var(--c-pes)} .tab-con{--tc:var(--c-con)}
.hello{padding-block:26px 0;display:flex;flex-direction:column;gap:10px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Panels */
main{padding-block:28px 72px}
.panel{display:flex;flex-direction:column;gap:clamp(28px,4vw,44px)}
.panel.enter{animation:panelIn .42s var(--ease)}
@keyframes panelIn{from{opacity:.25;transform:translateY(12px)}to{opacity:1;transform:none}}
#tab-panorama{--accent:var(--t-pan)} #tab-orcamento{--accent:var(--t-orc)} #tab-pesquisa{--accent:var(--t-pes)} #tab-consultorias{--accent:var(--t-con)}
.sec{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-h{display:flex;flex-direction:column;gap:8px}
.sec-h h2{font-size:clamp(1.45rem,3vw,2rem)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

/* Intro + KPIs */
.intro{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
.note{font-size:1.12rem;line-height:1.6;color:var(--ink)}
.note .sig{display:block;margin-top:10px;color:var(--ink-2);font-size:.98rem}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:.86rem;color:var(--ink-2)}
.kpi.hl{background:var(--forest);border-color:var(--forest);color:var(--on-forest)}
.kpi.hl .k,.kpi.hl .s{color:var(--on-forest-2)}

/* Roadmap */
.road{background:var(--forest);color:var(--on-forest);border-radius:20px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
.road .eyebrow{color:var(--on-forest-2)}
.road h2{color:var(--on-forest)}
.road-scroll{overflow-x:auto;margin-inline:-6px;padding-inline:6px;scrollbar-width:thin}
.road-in{position:relative;min-width:700px;padding-top:58px;padding-bottom:34px}
.road-grid{position:absolute;inset:0 0 0 0;pointer-events:none}
.road-grid .gl{position:absolute;top:58px;bottom:24px;width:0;border-left:1px dotted rgba(253,246,239,.22)}
.road-grid .gt{position:absolute;bottom:0;transform:translateX(-50%);font-family:var(--mono);font-size:.68rem;color:var(--on-forest-2);white-space:nowrap}
.road-axis{position:absolute;left:0;right:0;bottom:22px;height:2px;background:rgba(253,246,239,.55);border-radius:2px}
.pay{position:absolute;top:0;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.pay .pv{font-family:var(--mono);font-size:.74rem;font-weight:500;white-space:nowrap;padding:3px 8px;border-radius:999px;background:rgba(253,246,239,.12);color:var(--on-forest)}
.pay.done .pv{background:var(--sage);color:var(--sage-ink)}
.pay .pl{flex:1;width:0;border-left:1.5px dashed rgba(253,246,239,.38);margin-top:4px}
.pay .pd{width:12px;height:12px;border-radius:50%;background:var(--forest);border:2.5px solid var(--on-forest);margin-bottom:-7px}
.pay.done .pd{background:var(--sage);border-color:var(--sage)}
.rows{position:relative;display:flex;flex-direction:column;gap:9px}
.row{position:relative;height:30px}
.bar{position:absolute;top:0;height:30px;border-radius:999px;background:linear-gradient(90deg,var(--sage) 0%,color-mix(in srgb,var(--sage) 70%,var(--forest)) 100%);color:var(--sage-ink);display:flex;align-items:center;gap:6px;padding:0 12px;font-size:.8rem;font-weight:600;white-space:nowrap;transform-origin:left center;min-width:10px}
.bar::before{content:"";width:7px;height:7px;border-radius:50%;background:#fdf6ef;box-shadow:0 0 0 2px rgba(0,0,0,.08);flex:none;margin-left:-4px}
.bar.wb{background:linear-gradient(90deg,#e9d58b,#d2b45a);color:#2b2114}
.bar.ev{background:linear-gradient(90deg,#f1c9a3,#e3a06a);color:#2b1608}
.bar.im{background:rgba(253,246,239,.16);color:var(--on-forest)}
.bar.im::before{background:var(--sage)}
.bar.open{border-top-right-radius:6px;border-bottom-right-radius:6px}
.bar .lbl-out{position:absolute;left:calc(100% + 8px);color:var(--on-forest)}
.mark{position:absolute;top:58px;bottom:22px;width:0;border-left:2px solid #e9d58b;z-index:1}
.mark span{position:absolute;bottom:4px;left:6px;font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;color:#f3e2a6;white-space:nowrap;text-transform:uppercase}
.mark.end{border-left-color:#fdf6ef}
.mark.end span{color:#fdf6ef}
.mark + .mark span{bottom:22px}
.road-legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.8rem;color:var(--on-forest-2)}
.road-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.panel.enter .bar{animation:barIn .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms + 120ms)}
.panel.enter .pay{animation:fadeUp .5s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 80ms)}
@keyframes barIn{from{transform:scaleX(.08);opacity:.35}to{transform:none;opacity:1}}
@keyframes fadeUp{from{opacity:.2;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* Envios */
.envs{display:flex;flex-direction:column;gap:10px}
.env{background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:border-color .25s,box-shadow .3s var(--ease)}
.env.open{border-color:var(--line-2);box-shadow:var(--shadow)}
.env-h{all:unset;box-sizing:border-box;display:grid;grid-template-columns:76px minmax(0,1fr) auto 22px;gap:14px;align-items:center;width:100%;padding:14px 18px;cursor:pointer;border-radius:14px}
.env-h:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.env-h:active{transform:scale(.995)}
.env .d{font-family:var(--mono);font-size:.86rem;color:var(--ink-2)}
.env .w{font-weight:600;min-width:0}
.env .val{font-weight:800;font-size:1.08rem;font-variant-numeric:tabular-nums}
.chev{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);transition:transform .35s var(--ease)}
.chev svg{width:12px;height:12px;stroke:var(--ink-2);fill:none;stroke-width:2.2}
.env.open .chev{transform:rotate(180deg)}
.chip{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:600;vertical-align:2px;background:var(--wait-soft);color:var(--wait)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.env-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease)}
.env.open .env-b{grid-template-rows:1fr}
.env-b>div{overflow:hidden}
.env-in{padding:0 18px 16px 108px;display:flex;flex-direction:column;gap:10px;color:var(--ink-2);font-size:.96rem}
.split{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem}
.split span{display:inline-flex;align-items:center;gap:6px}
.split i{width:9px;height:9px;border-radius:2px;display:inline-block}
.total-line{display:flex;justify-content:space-between;align-items:baseline;padding:12px 18px 0;border-top:1px solid var(--line);font-weight:600}
.total-line b{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}

/* Conta */
.conta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field .k{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.field .v{font-weight:600;overflow-wrap:anywhere}
.copy{align-self:flex-start;margin-top:6px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:600;cursor:pointer;transition:background .2s,transform .15s}
.copy:hover{background:var(--surface)}
.copy:active{transform:scale(.96)}
.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Banco Mundial */
.wbcard{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.wbcard h3{font-size:1.35rem;margin-bottom:8px}
.wbcard p+p{margin-top:10px}
.wbcard p{color:var(--ink-2)}
.track{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.track li{position:relative;padding:0 0 16px 30px}
.track li::before{content:"";position:absolute;left:7px;top:16px;bottom:-2px;width:2px;background:var(--line-2)}
.track li:last-child::before{display:none}
.track li::after{content:"";position:absolute;left:0;top:4px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2.5px solid var(--t-pan)}
.track li.done::after{background:var(--t-pan)}
.track b{display:block;font-weight:600}
.track span{font-family:var(--mono);font-size:.78rem;color:var(--ink-3)}

/* Orçamento */
.chartp{background:var(--surface-2);border-radius:20px;padding:22px 22px 14px;display:flex;flex-direction:column;gap:12px}
.chart{position:relative;height:300px;margin:26px 8px 34px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart .area{fill:url(#gArea)}
.chart .line{fill:none;stroke:var(--forest);stroke-width:2.5;vector-effect:non-scaling-stroke}
:root[data-theme="dark"] .chart .line{stroke:var(--sage)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chart .line{stroke:var(--sage)}}
.chart .vl{position:absolute;bottom:0;width:0;border-left:1px dotted var(--line-2)}
.chart .pt{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--surface);border:2.5px solid var(--forest)}
.chart .pl{position:absolute;transform:translate(-50%,-140%);font-weight:800;font-size:.98rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.chart .xl{position:absolute;bottom:-26px;transform:translateX(-50%);font-family:var(--mono);font-size:.72rem;color:var(--ink-3);white-space:nowrap}
.chart .cap{position:absolute;left:0;right:0;border-top:2px dashed var(--t-orc)}
.chart .cap span{position:absolute;right:0;top:-24px;font-family:var(--mono);font-size:.72rem;color:var(--t-orc);white-space:nowrap}
.chart .base{position:absolute;left:0;right:0;bottom:0;border-top:2px solid var(--ink-2)}
.panel.enter .chart .line{stroke-dasharray:2400;animation:draw 1.1s var(--ease) both}
.panel.enter .chart .area{animation:fadeIn .9s ease both .25s}
.panel.enter .chart .pt,.panel.enter .chart .pl{animation:pop .45s var(--ease) both;animation-delay:calc(var(--i,0) * 110ms + 300ms)}
@keyframes draw{from{stroke-dashoffset:2400}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:.15}to{opacity:1}}
@keyframes pop{from{opacity:.2;scale:.6}to{opacity:1;scale:1}}
.cats{display:flex;flex-direction:column;gap:14px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:baseline}
.cat .nm{font-weight:600}
.cat .vv{font-weight:800;font-variant-numeric:tabular-nums}
.cat .track2{grid-column:1/-1;height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.cat .fill{height:100%;border-radius:999px;transform-origin:left;transition:transform .8s var(--ease)}
.cat .ds{grid-column:1/-1;font-size:.88rem;color:var(--ink-2)}
.panel.enter .cat .fill{animation:barIn .8s var(--ease) both .2s}
.unit{display:flex;flex-direction:column;gap:6px}
.unit .uv{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.unit .ud{color:var(--ink-2);font-size:.92rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem;min-width:560px}
.tbl th,.tbl td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-family:var(--mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.tbl tfoot td{font-weight:800;border-bottom:0}

/* Pesquisa */
.thesis{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:end}
.thesis .q{font-size:clamp(1.6rem,3.6vw,2.5rem);font-weight:800;line-height:1.1;letter-spacing:-.02em}
.thesis .q em{font-style:normal;color:var(--accent)}
.thesis .tt{color:var(--ink-2)}
.thesis .tt b{color:var(--ink);font-weight:600}
.photo{position:relative;border-radius:22px;overflow:hidden;background-color:#2b3f34;background-image:linear-gradient(180deg,rgba(18,28,22,.35),rgba(18,28,22,.78)),var(--hero);background-size:cover;background-position:center 30%;color:#fdf6ef;padding:clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:16px}
.photo .eyebrow{color:#f3e7d6}
.photo h2{color:#fdf6ef}
.bigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.big{background:rgba(253,246,239,.13);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(253,246,239,.22);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .3s var(--ease),background .3s}
.big:hover{transform:translateY(-3px);background:rgba(253,246,239,.19)}
.big .bn{font-size:clamp(1.5rem,6.2vw,2.8rem);white-space:nowrap;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.big .bl{font-size:.9rem;color:#efe5d8;line-height:1.4}
.big .bs{font-family:var(--mono);font-size:.66rem;color:#d9cdbd;letter-spacing:.04em}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:.92rem;text-decoration:none;border:0;cursor:pointer;transition:transform .2s var(--ease),filter .2s,box-shadow .2s}
#tab-orcamento .btn{color:var(--on-orc);background:var(--c-orc)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.97)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px currentColor}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}
#tab-pesquisa .btn{background:var(--c-pes)} #tab-pesquisa .btn.ghost{background:transparent;color:var(--t-pes)}
#tab-consultorias .btn{background:var(--c-con)} #tab-panorama .btn{background:var(--c-pan)}
.info h3{font-size:1.2rem;margin-bottom:8px}
.info p{color:var(--ink-2)}
.info p+p{margin-top:8px}
.info .meta{font-family:var(--mono);font-size:.74rem;color:var(--ink-3);letter-spacing:.03em;margin-bottom:6px}
.letter{margin-top:14px;display:flex;gap:12px;align-items:center}
.letter button.thumb{all:unset;cursor:pointer;width:84px;aspect-ratio:3/4;max-width:100%;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);background:#fff;transition:transform .25s var(--ease)}
.letter button.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.letter button.thumb:hover{transform:translateY(-3px) rotate(-1deg)}
.letter button.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

function chart(){
  var E=sorted();if(!E.length)return "";
  var cum=0,pts=E.map(function(e){cum+=tot(e);return {d:e.data,v:cum};});
  var a=pd(E[0].data),b=pd(E[E.length-1].data),span=Math.max(b-a,864e5);
  var cap=+S.combinado>0?+S.combinado:0,top=Math.max(cum,cap)*1.12||1;
  var X=function(d){return 4+(pd(d)-a)/span*92;},Y=function(v){return 100-v/top*100;};
  var line="M"+pts.map(function(p,i){return (X(p.d)*10).toFixed(1)+","+(Y(p.v)*4).toFixed(1);}).join(" L");
  var c=pts.map(function(p){return [X(p.d)*10,Y(p.v)*4];}),path="M"+c[0][0]+","+c[0][1];
  for(var i=1;i<c.length;i++){var mx=(c[i-1][0]+c[i][0])/2;path+=" C"+mx+","+c[i-1][1]+" "+mx+","+c[i][1]+" "+c[i][0]+","+c[i][1];}
  var area=path+" L"+c[c.length-1][0]+",400 L"+c[0][0]+",400 Z";

  if(cap)h+='<div class="cap" style="top:'+Y(cap)+'%"><span>Saldo do combinado · '+brlk(cap)+'</span></div>';
  h+='<div class="base"></div>';
  pts.forEach(function(p,i){var x=X(p.d),y=Y(p.v);

var SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n';
var FONTS="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600;800&family=IBM+Plex+Mono:wght@500&display=swap";
function buildDoc(state){
  var css=document.getElementById("plano-css").textContent;
  var vid=(document.getElementById("plano-video")||{}).textContent||"";
  var app=document.getElementById("plano-app").textContent;
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  return SKEL+'<title>Plano Londres</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="'+FONTS+'">\n<style id="plano-css">'+css+'</style>\n<div id="app"></div>\n<script type="text/plain" id="plano-video">'+vid+'<\/script>\n<script type="application/json" id="plano-data">'+json+'<\/script>\n<script id="plano-app">'+app+'<\/script>\n\n</body></html>';
}

function loadScript(src){return new Promise(function(res,rej){var s=document.createElement("script");s.src=src;s.onload=res;s.onerror=function(){rej(new Error("load"));};document.head.appendChild(s);});}
async function pdfPages(file){
  var base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  if(!window.pdfjsWorker)await loadScript(base+"pdf.worker.min.js");
  if(!window.pdfjsLib)await loadScript(base+"pdf.min.js");
  var lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js";
  var doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false,useSystemFonts:true}).promise;
  var out=[];
  for(var i=1;i<=Math.min(doc.numPages,3);i++){
    var pg=await doc.getPage(i),vp0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:1100/vp0.width});
    var cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:cx,viewport:vp}).promise;
    out.push({src:cv.toDataURL("image/jpeg",0.8),w:cv.width,h:cv.height});
  }
  return out;
}
function imgPage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var s=Math.min(1,1400/im.naturalWidth),cv=document.createElement("canvas");cv.width=Math.round(im.naturalWidth*s);cv.height=Math.round(im.naturalHeight*s);
      var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
      res({src:cv.toDataURL("image/jpeg",0.85),w:cv.width,h:cv.height});};
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error("img"));};im.src=url;
  });
}

function openEditor(){
  if(!ART)return;
  var D=JSON.parse(JSON.stringify(S));
  var num=function(id,label,val,step){return '<label>'+label+'<input type="number" min="0" step="'+(step||25)+'" inputmode="decimal" id="'+id+'" value="'+(+val||0)+'"></label>';};
  var txt=function(id,label,val){return '<label>'+label+'<input type="text" id="'+id+'" value="'+esc(val)+'"></label>';};
  function envForm(e,i){
    return '<fieldset><legend>Envio '+(i+1)+'</legend><div class="r2"><label>Data<input type="date" id="f'+i+'-data" value="'+esc(e.data)+'"></label><label>Situação<select id="f'+i+'-status"><option value="previsto"'+(e.status!=="enviado"?" selected":"")+'>Previsto</option><option value="enviado"'+(e.status==="enviado"?" selected":"")+'>Enviado</option></select></label></div>'+
      txt("f"+i+"-titulo","Título",e.titulo)+'<label>O que cobre<textarea id="f'+i+'-detalhe">'+esc(e.detalhe)+'</textarea></label>'+
      '<div class="r3">'+num("f"+i+"-moradia","Moradia (R$)",e.moradia)+num("f"+i+"-vida","Vida em Londres (R$)",e.vida)+num("f"+i+"-carreira","Carreira (R$)",e.carreira)+'</div>'+
      '<div class="sum" id="f'+i+'-sum">Total '+brl(tot(e))+'</div><button type="button" class="rm" data-rm="'+i+'">Remover este envio</button></fieldset>';
  }
  var html='<div class="ed-in"><div><p class="eyebrow">Modo de edição</p><h2>Editar o Plano</h2><p class="hint">Só você vê este painel. Ao salvar, a página é publicada de novo com os valores novos.</p></div>'+
    '<fieldset><legend>Referências</legend><div class="r2">'+num("f-cambio","Câmbio (R$ por libra)",D.cambio,0.01)+num("f-comb","Saldo do combinado (R$, 0 esconde)",D.combinado,50)+'</div></fieldset>'+
    '<div id="f-envs"></div><button type="button" class="add" id="f-add">Adicionar envio</button>'+
    '<fieldset><legend>Dados para depósito</legend>'+txt("f-fav","Favorecido",(D.conta||{}).favorecido)+'<div class="r2">'+txt("f-banco","Banco",(D.conta||{}).banco)+txt("f-pix","Chave PIX",(D.conta||{}).pix)+'</div><p class="hint">Aparece na aba Panorama Financeiro para quem abrir a página. Deixe em branco para esconder.</p></fieldset>'+
    '<fieldset><legend>Carta do Imperial College</legend><label>PDF ou imagem da carta<input type="file" id="f-carta" accept="application/pdf,image/png,image/jpeg,image/webp"></label><div class="thumbs" id="f-thumbs"></div><p class="hint" id="f-cmsg"></p><button type="button" class="rm" id="f-crm">Remover a carta</button></fieldset>'+
    '</div><div class="ed-bar"><span class="ed-msg" id="f-msg" role="status"></span><button type="button" class="ghostb" id="f-cancel">Cancelar</button><button type="button" class="primary" id="f-save">Salvar e publicar</button></div>';
  var ed=overlay("ed","Editar o plano",html),el=ed.el,$=function(id){return el.querySelector("#"+id);};
  function renderEnvs(){$("f-envs").innerHTML=D.envios.map(envForm).join("");}
  function thumbs(){var pg=(D.carta||[]).filter(function(p){return p&&okImg(p.src);});$("f-thumbs").innerHTML=pg.map(function(p,k){return '<img src="'+p.src+'" alt="Página '+(k+1)+' da carta">';}).join("");$("f-crm").hidden=!pg.length;}
  function pull(){
    D.cambio=+$("f-cambio").value||7;D.combinado=+$("f-comb").value||0;
    D.envios=D.envios.map(function(e,i){return {id:e.id||("e"+Date.now()+i),data:$("f"+i+"-data").value||e.data,status:$("f"+i+"-status").value,titulo:$("f"+i+"-titulo").value.trim(),detalhe:$("f"+i+"-detalhe").value.trim(),moradia:Math.max(0,+$("f"+i+"-moradia").value||0),vida:Math.max(0,+$("f"+i+"-vida").value||0),carreira:Math.max(0,+$("f"+i+"-carreira").value||0)};});
    D.conta={favorecido:$("f-fav").value.trim(),banco:$("f-banco").value.trim(),pix:$("f-pix").value.trim()};
  }
  renderEnvs();thumbs();
  el.addEventListener("input",function(e){var m=/^f(\d+)-(moradia|vida|carreira)$/.exec(e.target.id||"");if(!m)return;var i=m[1];
    $("f"+i+"-sum").textContent="Total "+brl((+$("f"+i+"-moradia").value||0)+(+$("f"+i+"-vida").value||0)+(+$("f"+i+"-carreira").value||0));});
  el.addEventListener("click",function(e){
    var rm=e.target.closest("[data-rm]");
    if(rm){pull();D.envios.splice(+rm.dataset.rm,1);renderEnvs();return;}
    if(e.target.id==="f-add"){pull();var last=D.envios[D.envios.length-1];D.envios.push({id:"e"+Date.now(),data:last?last.data:"2026-11-30",status:"previsto",titulo:"Novo envio",detalhe:"",moradia:0,vida:0,carreira:0});renderEnvs();return;}
    if(e.target.id==="f-crm"){D.carta=[];thumbs();$("f-cmsg").textContent="Carta removida. Salve para publicar.";return;}
    if(e.target.id==="f-cancel"){ed.close();return;}
    if(e.target.id==="f-save")save();
  });
  $("f-carta").addEventListener("change",async function(){
    var f=this.files&&this.files[0];if(!f)return;$("f-cmsg").textContent="Preparando a carta…";
    try{var pages=(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name))?await pdfPages(f):[await imgPage(f)];
      D.carta=pages;thumbs();$("f-cmsg").textContent="Carta pronta, "+pages.length+(pages.length>1?" páginas":" página")+". Salve para publicar.";}
    catch(err){$("f-cmsg").textContent="Não consegui ler esse arquivo aqui. Mande a carta no chat do Claude que ela entra na página.";}
  });
  async function save(){
    pull();
    var bad=D.envios.some(function(e){return !/^\d{4}-\d{2}-\d{2}$/.test(e.data)||!e.titulo;});
    if(bad){$("f-msg").textContent="Cada envio precisa de data e título.";return;}
    D.envios.sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:0;});
    var now=new Date();D.atualizado=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
    var btn=$("f-save");btn.disabled=true;$("f-msg").textContent="Publicando…";
    try{await ART.publish(buildDoc(D));$("f-msg").textContent="Publicado. A página vai atualizar.";}
    catch(err){
      var c=err&&err.code;btn.disabled=false;
      if(c==="conflict")$("f-msg").textContent="Outra versão foi publicada antes. A página vai recarregar com ela.";
      else if(["not_writer","not_granted","not_declared","capability_disabled","capability_removed","consent_required"].indexOf(c)>=0){$("f-msg").textContent="Esta visualização é só de leitura.";btn.disabled=true;}
      else if(c==="rate_limited")$("f-msg").textContent="Muitas publicações seguidas. Espere um minuto e salve de novo.";
      else if(c==="too_large")$("f-msg").textContent="A página ficou grande demais. Use uma carta com menos páginas.";
      else $("f-msg").textContent="Não deu para publicar agora. Tente de novo em instantes.";
    }
  }
  setTimeout(function(){var f=$("f-cambio");if(f)f.focus();},REDUCED?0:120);
}
})();
</script>
